[project]
name = "local-elections-rajasthan"
version = "1.0.0"
description = "Rajasthan local-election records and reproducible data transformations"
readme = "README.md"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }, { name = "Suriyan Laohaprapanon" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Rajasthan", "elections", "panchayats", "reservation", "data"]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["pandas>=3.0", "numpy>=2.0", "rapidfuzz>=3.14", "pdfplumber>=0.11", "pyarrow==23.0.1"]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_rajasthan"
Issues = "https://github.com/in-rolls/local_elections_rajasthan/issues"

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_rajasthan"]
